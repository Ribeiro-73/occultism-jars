# Memoria do Gradle. Se o build travar por falta de RAM, ajuste aqui.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# A configuration-cache do Gradle as vezes briga com o NeoGradle; deixamos desligada.
org.gradle.configuration-cache=false

# Parchment: nomes de parametros legiveis no codigo do Minecraft descompilado.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# --- Versoes de ambiente ---------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.235
loader_version_range=[1,)

# --- Propriedades do mod --------------------------------------------------
mod_id=occultismjars
mod_name=Occultism Jars
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.fjgoncalves.occultismjars
mod_authors=fj_goncalves
mod_description=Adiciona um jarro que aprisiona um Crusher (Foliot/Djinni/Afrit/Marid) da Occultism e automatiza a trituracao via funil e pipes.

# --- Versoes das dependencias de compilacao ------------------------------
occultism_version=1.21.1-neoforge-1.224.4
jei_version=19.51.0.418
